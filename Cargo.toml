[package]
name = "shopping-cart"
version = "1.0.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.99"
axum = { version = "0.8.4", features = ["macros"] }
axum-extra = { version = "0.10.1", features = ["cookie", "typed-header"] }
bcrypt = "0.17.1"
chrono = "0.4.34"
clap = { version = "4.5.1", features = ["derive", "env"] }
entities = { path = "./entities", version = "0.1.0" }
jsonwebtoken = "9.3.1"
once_cell = "1.21.3"
platforms = "3.3.0"
rust_decimal = "1.38.0"
sea-orm = { version = "1.1.16", features = [
  "sqlx-postgres",
  "runtime-tokio-rustls",
] }
serde = "1.0.196"
serde_json = "1.0.145"
thiserror = "2.0.16"
tokio = { version = "1.36.0", features = ["full"] }
validator = { version = "0.20.0", features = ["derive"] }

[build-dependencies]
platforms = "2.0.0"
