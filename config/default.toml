[server]
port = 8080
allowed_origin = "http://localhost:3000"

[database]
# Configure via APP_DATABASE__URL environment variable
# Example: postgres://user:password@localhost:5432/shopping_cart
url = "${APP_DATABASE__URL}"

[redis]
url = "redis://127.0.0.1:6379"

[jwt]
# Configure via APP_JWT__SECRET environment variable
# Generate with: openssl rand -base64 32
secret = "${APP_JWT__SECRET}"
expires_in_hours = 24

[log]
level = "debug"
