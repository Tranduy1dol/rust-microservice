[package]
name = "app_core"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
axum = "0.8.6"
bcrypt = "0.17.1"
chrono = "0.4.42"
entities = { path = "../entities" }
http = "1.3.1"
jsonwebtoken = { version = "10.2.0", features = ["rust_crypto"] }
lazy_static = "1.4.0"
regex = "1.12.2"
rust_decimal = "1.35"
sea-orm = "1.1.16"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = [
  "default",
  "env-filter",
] }
validator = { version = "0.20", features = ["derive"] }
