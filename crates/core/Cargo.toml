[package]
name = "core"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
axum = "0.8.6"
bcrypt = "0.17.1"
entities = { path = "../entities" }
http = "1.3.1"
jsonwebtoken = { version = "10.2.0", features = ["rust_crypto"] }
rust_decimal = "1.35"
sea-orm = "1.1.16"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "1.0"
validator = { version = "0.20", features = ["derive"] }
