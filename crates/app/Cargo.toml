[package]
name = "app"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
app_core = { path = "../core" }
axum = { version = "0.8.6", features = ["macros"] }
dotenv = "0.15.0"
figment = { version = "0.10.19", features = ["env", "toml"] }
http = "1.3.1"
infra = { path = "../infra" }
serde = { version = "1.0.225", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.41"
